services:
  mysql:
    image: mysql:8.4
    container_name: smarthome-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smarthome_product
      MYSQL_USER: smarthome
      MYSQL_PASSWORD: smarthome_dev
      MYSQL_ROOT_PASSWORD: root_dev
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro

volumes:
  mysql_data:
